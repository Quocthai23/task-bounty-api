version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: task-bounty-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-task_bounty}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: task-bounty-redis
    ports:
      - "26379:6379"
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.14
    container_name: task-bounty-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: myroot
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    restart: unless-stopped

  fiat-bridge:
    image: quocthai23/fiat-bridge:latest
    container_name: fiat-bridge
    ports:
      - "8080:8080"
    environment:
      - BRIDGE_PORT=8080
      - RPC_URL=${RPC_URL:-https://rpc.ankr.com/eth_sepolia}
      - CHAIN_ID=${CHAIN_ID:-11155111}
      - CONTRACT_ADDRESS=${CONTRACT_ADDRESS}
      - ADMIN_PRIVATE_KEY=${ADMIN_PRIVATE_KEY}
      - BANK_PAYOUT_API=http://host.docker.internal:3000/api/wallets/payout-webhook
      - HMAC_SECRET=${HMAC_SECRET:-my-super-secret-hmac-key}
    restart: unless-stopped
    depends_on:
      - postgres
      - vault
      - redis

volumes:
  pgdata:
